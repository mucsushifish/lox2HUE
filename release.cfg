[AUTOUPDATE]
# release.cfg: newest release for LoxBerry's automatic plugin update (sbin/pluginsupdate.pl).
# Update VERSION and ARCHIVEURL only after the GitHub release with this tag exists.

# Must be newer than the installed version to trigger an update
VERSION=0.2.3

# Zip of the tagged source; LoxBerry also finds plugin.cfg in its subfolder
ARCHIVEURL=https://github.com/mucsushifish/lox2HUE/archive/refs/tags/v0.2.3.zip

# Release notes
INFOURL=https://github.com/mucsushifish/lox2HUE/releases/tag/v0.2.3
