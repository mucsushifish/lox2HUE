# plugin.cfg - see https://wiki.loxberry.de/entwickler/plugin_fur_den_loxberry_entwickeln_ab_version_1x/start
# NAME/EMAIL in [AUTHOR] and NAME/FOLDER in [PLUGIN] must never change after the first release.

[AUTHOR]
NAME=mucsushifish
EMAIL=post@sushifish.de

[PLUGIN]
VERSION=0.2.1
NAME=lox2hue
FOLDER=lox2hue
TITLE=lox2HUE
WEBSITE=https://github.com/mucsushifish/lox2hue

[AUTOUPDATE]
AUTOMATIC_UPDATES=false
RELEASECFG=https://raw.githubusercontent.com/mucsushifish/lox2hue/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/mucsushifish/lox2hue/main/prerelease.cfg

[SYSTEM]
REBOOT=false
# The web UI uses the LoxBerry Design System (lb-* classes) of LoxBerry 4
LB_MINIMUM=4.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
